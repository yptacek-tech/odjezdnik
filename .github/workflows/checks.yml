name: Check Prague board
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/board.test.cjs
      - run: python3 build.py
      - run: python3 verify_site.py .
      - uses: actions/upload-artifact@v4
        with:
          name: prague-board
          path: |
            index.html
            data/
