name: Publish Odjezdník
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/board.test.cjs
      - run: python3 build.py
      - run: mkdir public && cp index.html public/ && cp -r data public/
      - run: python3 verify_site.py public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Check published stop downloads
        run: python3 verify_site.py public --url "${{ steps.deploy.outputs.page_url }}"

